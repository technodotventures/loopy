name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate manifests
        run: python tools/validate.py templates/loopy.yml examples/*.yml
      - name: Test the reference gate
        run: python -m unittest discover -s tests -v
