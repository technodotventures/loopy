# Loopy labels: the state machine. Create these in any repo that runs a loop.
# With the GitHub CLI:  yq -r '.[] | [.name, .color, .description] | @tsv' labels.yml | while IFS=$'\t' read n c d; do gh label create "$n" --color "$c" --description "$d" --force; done
- name: "loopy:request"
  color: "D9CFE6"
  description: "Community request for the loop to consider"
- name: "loopy:signal"
  color: "B9A6CF"
  description: "Triaged input to the loop"
- name: "loopy:proposal"
  color: "857591"
  description: "A change the loop wants to try"
- name: "loopy:experiment"
  color: "6B5579"
  description: "Draft PR under test"
- name: "loopy:keep"
  color: "EE9A2E"
  description: "Passed every gate"
- name: "loopy:revert"
  color: "D9473B"
  description: "Failed a gate; closed"
- name: "loopy:needs-human"
  color: "F2C94C"
  description: "Waiting for a code owner"
- name: "loopy:shipped"
  color: "2B1A33"
  description: "Merged"
- name: "loopy:report"
  color: "EFEAF4"
  description: "Cycle report"
- name: "loopy:source/requests"
  color: "EFEAF4"
  description: "Signal source: community requests"
